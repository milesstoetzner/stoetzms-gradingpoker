services:
  proxy:
    image: nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  frontend:
    image: node:22-alpine
    working_dir: /project
    volumes:
      - .:/project
    entrypoint: [ "sh", "-c", "corepack enable && corepack prepare pnpm@latest --activate && cd frontend && pnpm install && pnpm run dev" ]
    ports:
      - '4001:5173'
      - '5173:5173'

  backend:
    image: node:22-alpine
    working_dir: /project
    environment:
      STOETZMS_GRADING_POKER_REDIS_HOST: redis
    volumes:
      - .:/project
    entrypoint: [ "sh", "-c", "corepack enable && corepack prepare pnpm@latest --activate && cd backend && pnpm install && pnpm run dev" ]
    ports:
      - '4000:3000'

  redis:
    image: redis:8.0
    ports:
      - '6379:6379'

  redisinsight:
    image: redis/redisinsight:2.70
    environment:
      RI_REDIS_HOST: redis
    ports:
      - '5540:5540'
