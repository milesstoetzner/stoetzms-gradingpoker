---
apiVersion: v1
kind: Namespace
metadata:
  name: gradingpoker

---
# Shared state of all backend replicas (rooms and socket.io pub/sub). Rooms are ephemeral, hence, no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradingpoker-redis
  namespace: gradingpoker
  labels:
    app: gradingpoker-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gradingpoker-redis
  template:
    metadata:
      labels:
        app: gradingpoker-redis
    spec:
      containers:
        - name: gradingpoker-redis
          image: redis:8.0
          args: [ "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction" ]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gradingpoker-redis
  namespace: gradingpoker
  labels:
    app: gradingpoker-redis
spec:
  selector:
    app: gradingpoker-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradingpoker-backend
  namespace: gradingpoker
  labels:
    app: gradingpoker-backend
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gradingpoker-backend
  template:
    metadata:
      labels:
        app: gradingpoker-backend
    spec:
      containers:
        - name: gradingpoker-backend
          image: ghcr.io/milesstoetzner/stoetzms-gradingpoker:backend-2a12706
          env:
            - name: STOETZMS_GRADING_POKER_PERSISTENCY
              value: redis
            - name: STOETZMS_GRADING_POKER_REDIS_HOST
              value: gradingpoker-redis
          ports:
            - name: socketio
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: socketio
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: socketio
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: gradingpoker-backend
  namespace: gradingpoker
  labels:
    app: gradingpoker-backend
spec:
  selector:
    app: gradingpoker-backend
  ports:
    - name: socketio
      protocol: TCP
      port: 3000
      targetPort: socketio


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradingpoker-frontend
  namespace: gradingpoker
  labels:
    app: gradingpoker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gradingpoker-frontend
  template:
    metadata:
      labels:
        app: gradingpoker-frontend
    spec:
      containers:
        - name: gradingpoker-frontend
          image: ghcr.io/milesstoetzner/stoetzms-gradingpoker:frontend-2a12706
          env:
            - name: STOETZMS_GRADING_POKER_IMPRESSUM_URL
              value: https://www.uni-stuttgart.de/impressum
          ports:
            - name: http
              containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gradingpoker-frontend
  namespace: gradingpoker
  labels:
    app: gradingpoker-frontend
spec:
  selector:
    app: gradingpoker-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gradingpoker
  namespace: gradingpoker
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ gradingpoker.rss.iste.uni-stuttgart.de ]
      secretName: gradingpoker-tls
  rules:
    - host: gradingpoker.rss.iste.uni-stuttgart.de
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: gradingpoker-backend
                port:
                  name: socketio
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gradingpoker-frontend
                port:
                  name: http
