services:
  frontend:
    build:
      dockerfile: frontend/Dockerfile
      context: .
    restart: unless-stopped
    ports:
      - '3001:80'

  backend:
    build:
      dockerfile: backend/Dockerfile
      context: .
    restart: unless-stopped
    environment:
      STOETZMS_GRADING_POKER_PERSISTENCY: redis
    ports:
      - '3000:3000'

  redis:
    image: redis:8.0
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:2.70
    environment:
      RI_REDIS_HOST: redis
    ports:
      - '5540:5540'
