services:
  frontend:
    build:
      dockerfile: frontend/Dockerfile
      context: .
    restart: unless-stopped
    ports:
      - '3001:80'

  backend:
    build:
      dockerfile: backend/Dockerfile
      context: .
    restart: unless-stopped
    ports:
      - '3000:3000'

  redis:
    image: redis:8.0
    restart: unless-stopped
