# Images are tagged <repository>:backend-<tag> and <repository>:frontend-<tag>
image:
  repository: ghcr.io/milesstoetzner/stoetzms-gradingpoker
  # Defaults to the version of a released chart. Required when installing the chart from this repository,
  # e.g. the commit tag printed by build-and-push.sh
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  # Additional environment variables, e.g. STOETZMS_GRADING_POKER_OFFLINE_GRACE (see backend/src/config.ts)
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  # Links below the join card, only shown if set
  impressumUrl: ""
  privacyUrl: ""
  resources: {}

# Shared state of all backend replicas (rooms and socket.io pub/sub), see https://github.com/CloudPirates-io/helm-charts
# (charts/redis). Three Redis instances, each with a Sentinel next to it: the Sentinels promote a replica when the
# master fails, and the backend asks them for the current master.
redis:
  architecture: replication
  replicaCount: 3
  sentinel:
    enabled: true
    masterName: gradingpoker
    quorum: 2
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 64Mi
  # Rooms are ephemeral, hence, nothing is written to disk. A restarted instance syncs from the current master.
  persistence:
    enabled: false
  # noeviction: writes fail loudly rather than silently evicting rooms
  extraConfig: |
    maxmemory 200mb
    maxmemory-policy noeviction
    save ""
    appendonly no
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Gateway API route (/socket.io to the backend, everything else to the frontend)
route:
  enabled: true
  host: gradingpoker.example.com
  # Gateway (and optionally its listener) the route attaches to. TLS is terminated by that listener, and the Gateway
  # must allow routes from the namespace of this release.
  parentRefs:
    - name: gateway
      namespace: gateway
      # sectionName: https
  annotations: {}
