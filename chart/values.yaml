# Images are tagged <repository>:backend-<tag> and <repository>:frontend-<tag>
image:
  repository: ghcr.io/milesstoetzner/stoetzms-gradingpoker
  # Defaults to the version of a released chart. Required when installing the chart from this repository
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  # Seconds a user who lost the connection keeps their seat and vote
  offlineGrace: 600
  # Seconds without changes after which a room is deleted (7 days)
  roomTtl: 604800
  # Seconds between the heartbeats that tell clients the current version of their room
  heartbeat: 5
  # Scales the replicas with the CPU load (HorizontalPodAutoscaler) instead of the fixed number above.
  # Connections are long-lived: a new replica only gets new connections, and removing a replica disconnects its
  # users, who reconnect to another replica and keep their seat.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Limits how many replicas may be down at once for planned disruptions like node drains (PodDisruptionBudget)
  pdb:
    enabled: true
    maxUnavailable: 1
  # Additional environment variables (see backend/src/config.ts)
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  # Scales the replicas with the CPU load (HorizontalPodAutoscaler) instead of the fixed number above.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # Limits how many replicas may be down at once for planned disruptions like node drains (PodDisruptionBudget)
  pdb:
    enabled: true
    maxUnavailable: 1
  # Links below the join card, only shown if set
  impressumUrl: ""
  privacyUrl: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

# Shared state of all backend replicas (rooms and socket.io pub/sub), see https://github.com/CloudPirates-io/helm-charts
# (charts/redis). A Redis Cluster: the rooms and their pub/sub channels are spread over the masters, and every master
# has a replica that takes over if it fails. The backend talks to the node that owns a room.
redis:
  architecture: cluster
  # All nodes: 3 masters, each with 1 replica. Add masters for more capacity (keep it a multiple of clusterReplicaCount + 1)
  replicaCount: 6
  clusterReplicaCount: 1
  cluster:
    # A restarted master comes back empty and must not rejoin before its replica took over
    startupSleepTime: 20
    config:
      nodeTimeout: 5000
  # A small volume per node, only for the node's cluster membership: without it, a restarted node comes back as a
  # stranger and never rejoins the cluster. The rooms themselves are ephemeral and not written to disk (see below).
  persistence:
    enabled: true
    size: 1Gi
  # At most one Redis node may be down at once for planned disruptions, so a master and its replica never go together
  pdb:
    enabled: true
    minAvailable: ""
    maxUnavailable: 1
  # Per node. noeviction: writes fail loudly rather than silently evicting rooms
  extraConfig: |
    maxmemory 200mb
    maxmemory-policy noeviction
    save ""
    appendonly no
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Gateway API route (/socket.io to the backend, everything else to the frontend)
route:
  enabled: true
  host: gradingpoker.example.com
  # Gateway (and optionally its listener) the route attaches to. TLS is terminated by that listener, and the Gateway
  # must allow routes from the namespace of this release.
  parentRefs:
    - name: gateway
      namespace: gateway
      # sectionName: https
  annotations: {}
