# Images are tagged <repository>:backend-<tag> and <repository>:frontend-<tag>, see build-and-push.sh
image:
  repository: ghcr.io/milesstoetzner/stoetzms-gradingpoker
  tag: 2a12706
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  # Additional environment variables, e.g. STOETZMS_GRADING_POKER_OFFLINE_GRACE (see backend/src/config.ts)
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  # Links below the join card, only shown if set
  impressumUrl: https://www.uni-stuttgart.de/impressum
  privacyUrl: ""
  resources: {}

# Shared state of all backend replicas (rooms and socket.io pub/sub). Rooms are ephemeral, hence, no persistence.
redis:
  image: redis:8.0
  maxmemory: 200mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Gateway API route (/socket.io to the backend, everything else to the frontend)
route:
  enabled: true
  host: gradingpoker.rss.iste.uni-stuttgart.de
  # Gateway (and optionally its listener) the route attaches to. TLS is terminated by that listener, and the Gateway
  # must allow routes from the namespace of this release.
  parentRefs:
    - name: gateway
      namespace: gateway
      # sectionName: https
  annotations: {}
