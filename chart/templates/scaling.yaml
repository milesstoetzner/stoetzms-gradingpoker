{{- /* PodDisruptionBudget and HorizontalPodAutoscaler of the backend and the frontend */ -}}
{{- range $component := list "backend" "frontend" }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $values := index $.Values $component }}
{{- if $values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gradingpoker.name" $ctx }}
  labels:
    {{- include "gradingpoker.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "gradingpoker.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- if $values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gradingpoker.name" $ctx }}
  labels:
    {{- include "gradingpoker.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gradingpoker.name" $ctx }}
  minReplicas: {{ $values.autoscaling.minReplicas }}
  maxReplicas: {{ $values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
