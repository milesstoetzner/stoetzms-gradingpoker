{{- $ctx := dict "root" . "component" "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gradingpoker.name" $ctx }}
  labels:
    {{- include "gradingpoker.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gradingpoker.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gradingpoker.selectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: {{ include "gradingpoker.name" $ctx }}
          image: {{ .Values.redis.image }}
          args: [ "--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "noeviction" ]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            periodSeconds: 5
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gradingpoker.name" $ctx }}
  labels:
    {{- include "gradingpoker.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "gradingpoker.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
